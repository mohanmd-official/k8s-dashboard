# Apply in EVERY target cluster. Binds the Kubernetes group "eks-lens" (mapped from the
# spoke IAM role by the EKS access entry, see deploy/terraform/spoke) to:
#   eks-lens-view  - read inventory, metrics and logs (required)
#   eks-lens-exec     - open a shell in pods (optional)
#   eks-lens-secrets  - read Secret values (optional)
#   eks-lens-edit     - create / edit / delete from the UI (optional)
# Delete the bindings you do not want. Using your own SSO admin login locally needs none of this.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eks-lens-view
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, pods, pods/log, events, services, configmaps, serviceaccounts, persistentvolumeclaims, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eks-lens-exec
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eks-lens-view
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: eks-lens-view }
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: eks-lens }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eks-lens-exec
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: eks-lens-exec }
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: eks-lens }
---
# Optional: read Secret values (Config & Secrets tab). Without it, the Secrets list stays empty.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eks-lens-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
---
# Optional: create / edit / delete from the UI (Deployments, Pods, Secrets, ConfigMaps, Services, ...).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eks-lens-edit
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, secrets, persistentvolumeclaims, serviceaccounts, namespaces]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets, deployments/scale, statefulsets/scale]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eks-lens-secrets
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: eks-lens-secrets }
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: eks-lens }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eks-lens-edit
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: eks-lens-edit }
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: eks-lens }
