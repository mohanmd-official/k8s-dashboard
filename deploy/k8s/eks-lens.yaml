# Runs EKS Lens in the hub cluster. Identity comes from EKS Pod Identity
# (see deploy/terraform/hub). Replace the image, hostname, certificate and OIDC values.
apiVersion: v1
kind: Namespace
metadata:
  name: eks-lens
  labels: { team: platform }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eks-lens
  namespace: eks-lens
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eks-lens-accounts
  namespace: eks-lens
data:
  accounts.yaml: |
    settings:
      refreshSeconds: 60
      readOnly: false
      costModel: { hoursPerMonth: 730, spotDiscount: 0.65, cpuToMemCostRatio: 7.46 }
    accounts:
      - name: shared-services
        accountId: "111111111111"
        roleArn: arn:aws:iam::111111111111:role/eks-lens-spoke
        externalId: eks-lens
        regions: [ap-south-1]
      - name: client-prod
        accountId: "222222222222"
        roleArn: arn:aws:iam::222222222222:role/eks-lens-spoke
        externalId: eks-lens
        regions: [us-east-1]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-lens
  namespace: eks-lens
spec:
  replicas: 1   # inventory cache is in-memory; scale out only with sticky sessions for WebSockets
  selector: { matchLabels: { app: eks-lens } }
  template:
    metadata: { labels: { app: eks-lens } }
    spec:
      serviceAccountName: eks-lens
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: eks-lens
          image: 111111111111.dkr.ecr.ap-south-1.amazonaws.com/eks-lens:0.1.0
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: ACCOUNTS_FILE, value: /config/accounts.yaml }
            - { name: AWS_REGION, value: ap-south-1 }
            - { name: KUBECTL_WRITE, value: "false" }
            # Comma-separated SSO emails allowed to open pod shells; empty = every signed-in user
            - { name: EXEC_ALLOWED_USERS, value: "" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: eks-lens-accounts } }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: eks-lens
  namespace: eks-lens
spec:
  selector: { app: eks-lens }
  ports: [{ port: 80, targetPort: http, name: http }]
---
# Internal ALB with OIDC sign-in (Okta / Entra ID / Cognito / IAM Identity Center via OIDC app).
# The ALB passes the signed-in identity in x-amzn-oidc-* headers, which EKS Lens writes to its audit log.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eks-lens
  namespace: eks-lens
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:111111111111:certificate/REPLACE
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
    alb.ingress.kubernetes.io/auth-type: oidc
    alb.ingress.kubernetes.io/auth-idp-oidc: '{"issuer":"https://REPLACE","authorizationEndpoint":"https://REPLACE/authorize","tokenEndpoint":"https://REPLACE/token","userInfoEndpoint":"https://REPLACE/userinfo","secretName":"eks-lens-oidc"}'
    alb.ingress.kubernetes.io/auth-scope: openid email profile
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
spec:
  ingressClassName: alb
  rules:
    - host: eks-lens.internal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: eks-lens, port: { number: 80 } } }
