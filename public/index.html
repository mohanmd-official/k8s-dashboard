<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EKS Lens · Cloud Destinations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M16 2 28.1 9v14L16 30 3.9 23V9Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="5.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 4.5v6.3M16 21.2v6.3M5.9 10l5.5 3.2M20.6 18.8l5.5 3.2M5.9 22l5.5-3.2M20.6 13.2l5.5-3.2" stroke="currentColor" stroke-width="1.6"/></svg>
      <div><b>EKS Lens</b><span class="cd-mark">Cloud <em>Destinations</em></span><span id="modeTag" class="mode-tag"></span></div>
    </div>
    <nav class="side-nav" aria-label="Main">
      <button id="fleetBtn" type="button"><span>Fleet overview</span><span class="count" id="fleetCount"></span></button>
      <button id="accountsBtn" type="button"><span>AWS accounts</span><span class="count" id="acctCount"></span></button>
      <button id="activityBtn" type="button"><span>Activity log</span></button>
    </nav>
    <div class="side-h">Clusters</div>
    <div class="tree" id="tree" role="tree" aria-label="AWS accounts and EKS clusters"></div>
    <div class="side-foot">
      <span id="whoami" class="muted"></span>
      <span style="display:flex;gap:6px;align-items:center">
        <select id="fontPick" class="font-pick" aria-label="Font"><option value="">Inter + Poppins</option><option value="jakarta">Plus Jakarta Sans</option><option value="system">Apple system font</option><option value="plex">IBM Plex</option></select>
        <button class="ghost" id="themeBtn" type="button" title="Switch light / dark">Theme</button>
      </span>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="top">
      <button class="ghost menu-btn" id="menuBtn" type="button" aria-label="Clusters">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <label class="switch"><input type="checkbox" id="autoRefresh" checked> <span>Auto-refresh</span></label>
        <span class="muted small" id="updated"></span>
        <button class="btn" id="refreshBtn" type="button">Refresh</button>
      </div>
    </header>

    <section class="content" id="content"></section>
  </main>

  <section class="dock" id="dock" hidden>
    <div class="dock-grip" id="dockGrip" title="Drag to resize"></div>
    <div class="dock-tabs" id="dockTabs"></div>
    <div class="dock-body" id="dockBody"></div>
  </section>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-card" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <header><h3 id="drawerTitle"></h3><button class="ghost" id="drawerClose" type="button">Close</button></header>
    <div id="drawerBody"></div>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
